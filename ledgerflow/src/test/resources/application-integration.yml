spring:
  # ── PostgreSQL – points to the running Docker container ────────────────
  datasource:
    url: jdbc:postgresql://localhost:5434/ledgerflow?sslmode=disable
    username: ledgerflow
    password: ledgerflow
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      connection-timeout: 30000


  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Redis – same Docker container ───────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      timeout: 2000ms

  # ── RabbitMQ – same Docker container ───────────────────────────────────
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

# ── Logging (quieter during tests) ─────────────────────────────────────
logging:
  level:
    root: WARN
    com.karthik.ledgerflow: INFO
    org.hibernate.SQL: DEBUG
