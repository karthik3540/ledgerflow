spring:
  application:
    name: ledgerflow

  # ── PostgreSQL / JPA ──────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5434/ledgerflow?sslmode=disable
    username: ${POSTGRES_USER:ledgerflow}
    password: ${POSTGRES_PASSWORD:ledgerflow}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate           # Flyway manages the schema
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Flyway ────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Redis ─────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # ── RabbitMQ ──────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

# ── Server ────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /api

# ── Logging ───────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.karthik.ledgerflow: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
